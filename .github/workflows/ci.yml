
name: FastPhysics CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug
            build_type: Debug
            sanitizers: "OFF"

          - name: Release
            build_type: Release
            sanitizers: "OFF"

          - name: Sanitizers
            build_type: Debug
            sanitizers: "ON"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S . -B build/ci \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DFASTPHYSICS_ENABLE_SANITIZERS=${{ matrix.sanitizers }} \
            -DFASTPHYSICS_ENABLE_NATIVE_OPTIMIZATIONS=OFF \
            -DFASTPHYSICS_ENABLE_OPENMP=ON

      - name: Build FastPhysics
        run: cmake --build build/ci --parallel 2

      - name: Run tests
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          ctest --test-dir build/ci \
            --output-on-failure
